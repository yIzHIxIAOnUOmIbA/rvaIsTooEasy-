[package]
name = "rva_core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
memmap2 = "0.9"
goblin = "0.8"
pelite = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
blake3 = "1"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }

[target.'cfg(windows)'.dependencies]
# Task B: OS DPAPI encryption protection for private keys (CryptProtectData / CryptUnprotectData)
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory"] }
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
iced-x86 = "1.21"
# Enable on demand in later iterations: symbolic / gimli / pdb / diffy / tokio
